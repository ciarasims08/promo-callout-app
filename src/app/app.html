@if (!isPromoDismissed && promo) {
  <section class="callouts">
    <h2>Promotional Message</h2>

    <app-promo-callout
      [content]="promo"
      [loading]="false"
      [featureEnabled]="true"
      (dismissed)="onPromoDismissed($event)"
    />
  </section>
}

@if (isPromoDismissed) {
  <div
    class="sr-only"
    role="status"
    aria-live="polite"
  >
    Promotional message dismissed.
  </div>
}

@if (!isInfoDismissed && info) {
  <section class="callouts">
    <h2>Informational Message</h2>

    <app-promo-callout
      [content]="info"
      [loading]="false"
      [featureEnabled]="true"
      (dismissed)="onInfoDismissed($event)"
    />
  </section>
}

@if (isInfoDismissed) {
  <div
    class="sr-only"
    role="status"
    aria-live="polite"
  >
    Informational message dismissed.
  </div>
}
